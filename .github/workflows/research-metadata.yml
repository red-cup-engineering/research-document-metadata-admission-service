name: Research metadata and research-object conformance
on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/research-metadata.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/research-metadata.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check original source syntax
        run: npm run check
      - name: Test citations and research-object projections
        run: npm test
